<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Yunhao Zhou's blog on research, engineering, and ideas" />
    <meta name="author" content="Yunhao Zhou" />
    <title>Blog · Yunhao Zhou</title>

    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,500;0,600;0,700;1,300;1,500;1,600;1,700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;1,400&amp;display=swap"
        rel="stylesheet" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />

    <script type="text/javascript" src="static/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="static/js/marked.min.js"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: false,
                processEnvironments: true
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script"
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script type="text/javascript" src="static/js/js-yaml.min.js"></script>
    <script type="text/javascript" src="static/js/blog.js"></script>
</head>

<body class="blog-page">
    <nav class="header navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="mainNav">
        <div class="container px-5">
            <a id="page-top-title" class="navbar-brand fw-bold" href="./">Yunhao Zhou</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                MENU
                <i class="bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto me-4 my-3 my-lg-0">
                    <li class="nav-item"><a class="nav-link me-lg-3" href="./#page-top">HOME</a></li>
                    <li class="nav-item"><a class="nav-link me-lg-3" href="./#publications">PUBLICATIONS</a></li>
                    <li class="nav-item"><a class="nav-link me-lg-3 active" aria-current="page" href="blog.html">BLOG</a></li>
                    <li class="nav-item"><a class="nav-link me-lg-3" href="./#awards">AWARDS</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="blog-page-main">
        <header class="blog-hero">
            <div class="container px-5">
                <p class="blog-hero-eyebrow" id="blog-hero-eyebrow">YUNHAO ZHOU'S BLOG</p>
                <h1 id="blog-hero-title">Notes &amp; Ideas</h1>
                <p id="blog-hero-description">Research notes, engineering practice, and ideas worth remembering.</p>
            </div>
        </header>

        <section class="blog-content-section" id="blog-content">
            <div class="container px-5">
                <header class="blog-section-header">
                    <div>
                        <h2 id="blog-view-title">All Posts</h2>
                        <p id="blog-view-description">The latest writing, sorted from newest to oldest.</p>
                    </div>
                    <div class="blog-section-actions">
                        <div class="blog-language-switch" role="group" aria-label="Article language">
                            <button type="button" data-blog-language="en" aria-pressed="true">EN</button>
                            <button type="button" data-blog-language="zh" aria-pressed="false">中文</button>
                        </div>
                        <a class="blog-back-link" id="blog-back-link" href="blog.html" hidden>
                            <i class="bi bi-arrow-left"></i>&nbsp;All posts
                        </a>
                    </div>
                </header>
                <div id="blog-list" aria-live="polite"></div>
                <article class="blog-post" id="blog-post" hidden aria-live="polite"></article>
            </div>
        </section>
    </main>

    <footer class="bg-bottom text-center py-5">
        <div class="container px-5">
            <div class="text-white-50 small">
                <div id="copyright-text" class="mb-2">&copy; Yunhao Zhou. All Rights Reserved.</div>
                <a href="https://github.com/yyh-sjtu">Github</a>
                <span class="mx-1">&middot;</span>
                <a href="./">Homepage</a>
            </div>
        </div>
    </footer>
</body>

</html>
