<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Yunhao Zhou's blog on research, engineering, and ideas" />
    <meta name="author" content="Yunhao Zhou" />
    <title>Blog · Yunhao Zhou</title>

    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
    <link rel="stylesheet" href="static/css/portfolio.css"><link rel="stylesheet" href="static/css/writing.css">
    <script src="static/js/navigation.js" defer></script>
    <script type="text/javascript" src="static/js/marked.min.js"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: false,
                processEnvironments: true
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script"
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script type="text/javascript" src="static/js/js-yaml.min.js"></script>
    <script type="text/javascript" src="static/js/blog.js"></script>
</head>

<body class="blog-page">
    <a class="skip-link" href="#blog-content">Skip to content</a>
    <nav class="site-nav" aria-label="Main navigation"><a id="page-top-title" class="wordmark" href="./">Yunhao Zhou</a><button class="menu-toggle" aria-expanded="false" aria-controls="site-links">Menu</button><div id="site-links"><a href="./#experience">Experience</a><a href="./#publications">Publications</a><a id="blog-nav-link" href="blog.html" aria-current="page">Writing</a><a href="./#awards">Awards</a></div></nav>
    <main class="blog-page-main">
        <header class="blog-hero">
            <div class="container px-5">
                <p class="blog-hero-eyebrow" id="blog-hero-eyebrow">YUNHAO ZHOU'S BLOG</p>
                <h1 id="blog-hero-title">Notes &amp; Ideas</h1>
                <p id="blog-hero-description">Research notes, engineering practice, and ideas worth remembering.</p>
            </div>
        </header>

        <section class="blog-content-section" id="blog-content">
            <div class="container px-5">
                <header class="blog-section-header">
                    <div>
                        <h2 id="blog-view-title">All Posts</h2>
                        <p id="blog-view-description">The latest writing, sorted from newest to oldest.</p>
                    </div>
                    <div class="blog-section-actions">
                        <div class="blog-language-switch" role="group" aria-label="Article language">
                            <button type="button" data-blog-language="en" aria-pressed="true">EN</button>
                            <button type="button" data-blog-language="zh" aria-pressed="false">中文</button>
                        </div>
                        <a class="blog-back-link" id="blog-back-link" href="blog.html" hidden>
                            <i class="bi bi-arrow-left"></i>&nbsp;All posts
                        </a>
                    </div>
                </header>
                <div class="filter-bar" id="blog-filters" hidden><label class="search-label"><span id="blog-search-label">Search writing</span><input id="blog-search" type="search" aria-labelledby="blog-search-label"></label><label><span id="blog-topic-label">Topic</span><select id="blog-topic" aria-labelledby="blog-topic-label"></select></label><p id="blog-result-count" role="status"></p></div>
                <div id="blog-list" aria-live="polite"></div>
                <article class="blog-post" id="blog-post" hidden aria-live="polite"></article>
            </div>
        </section>
    </main>

    <footer class="site-footer"><span id="copyright-text">© Yunhao Zhou</span><a href="mailto:yunhaoz.cs@gmail.com">Let’s connect ↗</a><a href="./">Homepage ↗</a></footer>
</body></html>
